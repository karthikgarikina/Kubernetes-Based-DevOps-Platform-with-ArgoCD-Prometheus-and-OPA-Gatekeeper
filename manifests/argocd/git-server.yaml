apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: argocd
  labels:
    app: git-server
spec:
  type: NodePort
  ports:
    - port: 9418
      targetPort: 9418
      nodePort: 30080
      name: git
  selector:
    app: git-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: argocd
  labels:
    app: git-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-server
  template:
    metadata:
      labels:
        app: git-server
    spec:
      containers:
        - name: git-server
          image: local-git-server:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9418
              name: git
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi