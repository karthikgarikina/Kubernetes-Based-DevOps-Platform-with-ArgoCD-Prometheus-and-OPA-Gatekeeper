apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequirenonroot
spec:
  crd:
    spec:
      names:
        kind: K8sRequireNonRoot
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequirenonroot

        # Deny if container explicitly sets runAsRoot: true
        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          container.securityContext.runAsRoot == true
          msg := sprintf("Container '%v' specifies runAsRoot: true, which is forbidden.", [container.name])
        }

        # Deny if container runs as user 0 (root)
        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          container.securityContext.runAsUser == 0
          msg := sprintf("Container '%v' specifies runAsUser: 0 (root), which is forbidden.", [container.name])
        }