apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cluster-health
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cluster-health.json: |
    {
      \"annotations\": { \"list\": [] },
      \"editable\": true,
      \"fiscalYearStartMonth\": 0,
      \"graphTooltip\": 0,
      \"id\": null,
      \"links\": [],
      \"liveNow\": false,
      \"panels\": [
        {
          \"title\": \"Cluster Node Count\",
          \"type\": \"stat\",
          \"gridPos\": { \"h\": 4, \"w\": 6, \"x\": 0, \"y\": 0 },
          \"targets\": [
            { \"expr\": \"count(kube_node_info)\", \"refId\": \"A\" }
          ]
        },
        {
          \"title\": \"Total Pods Running\",
          \"type\": \"stat\",
          \"gridPos\": { \"h\": 4, \"w\": 6, \"x\": 6, \"y\": 0 },
          \"targets\": [
            { \"expr\": \"sum(kube_pod_status_phase{phase='Running'})\", \"refId\": \"A\" }
          ]
        },
        {
          \"title\": \"Node CPU Utilization (%)\",
          \"type\": \"timeseries\",
          \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 0, \"y\": 4 },
          \"targets\": [
            { \"expr\": \"100 - (avg by (instance) (rate(node_cpu_seconds_total{mode='idle'}[2m])) * 100)\", \"legendFormat\": \"{{instance}}\", \"refId\": \"A\" }
          ]
        },
        {
          \"title\": \"Node Memory Utilization (%)\",
          \"type\": \"timeseries\",
          \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 12, \"y\": 4 },
          \"targets\": [
            { \"expr\": \"(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100\", \"legendFormat\": \"{{instance}}\", \"refId\": \"A\" }
          ]
        }
      ],
      \"refresh\": \"10s\",
      \"schemaVersion\": 38,
      \"style\": \"dark\",
      \"tags\": [\"kubernetes\", \"cluster-health\"],
      \"time\": { \"from\": \"now-1h\", \"to\": \"now\" },
      \"title\": \"Kubernetes Cluster Health & Capacity\",
      \"uid\": \"cluster-health-overview\"
    }
