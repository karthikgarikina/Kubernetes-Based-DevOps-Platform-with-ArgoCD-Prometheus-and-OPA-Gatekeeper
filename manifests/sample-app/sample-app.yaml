apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    tier: production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-app-sa
  namespace: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-microservice-api
  namespace: production
  labels:
    app: sample-microservice-api
    tier: workloads
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-microservice-api
  template:
    metadata:
      labels:
        app: sample-microservice-api
        tier: workloads
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "sample-app-role"
        vault.hashicorp.com/agent-inject-secret-database-config: "secret/data/database/config"
        vault.hashicorp.com/agent-inject-template-database-config: |
          {{- with secret "secret/data/database/config" -}}
          DB_USER={{ .Data.data.username }}
          DB_PASSWORD={{ .Data.data.password }}
          DB_HOST={{ .Data.data.host }}
          DB_PORT={{ .Data.data.port }}
          {{- end }}
    spec:
      serviceAccountName: sample-app-sa
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: sample-microservice-api
          image: sample-microservice-api:v1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger-collector.tracing.svc.cluster.local:4318/v1/traces"
            - name: OTEL_SERVICE_NAME
              value: "sample-microservice-api"
            - name: VAULT_SECRET_PATH
              value: "/vault/secrets/database-config"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sample-microservice-api
  namespace: production
  labels:
    app: sample-microservice-api
    tier: workloads
    release: kube-prometheus-stack
spec:
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000
  selector:
    app: sample-microservice-api
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sample-microservice-api-monitor
  namespace: production
  labels:
    app: sample-microservice-api
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: sample-microservice-api
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
