# submission.yml: Automated Evaluation Suite for Kubernetes DevOps Platform
version: "1.0"
phases:
  setup:
    - echo "Environment setup initialized..."
  test:
    # 1. Verify Multi-node Kubernetes Cluster
    - kubectl get nodes --no-headers | wc -l | grep -q '^[2-9]' || exit 1
    # 2. Verify ArgoCD HA (at least 2 running argocd-server pods)
    - kubectl get pods -n argocd -l app.kubernetes.io/name=argocd-server --no-headers | wc -l | grep -q '^[2-9]' || exit 1
    # 3. Verify ArgoCD App of Apps Root Application
    - kubectl get application platform-bootstrap -n argocd || exit 1
    # 4. Verify OPA Gatekeeper Admission Policy Rejection (Forbidden :latest image tag)
    - kubectl apply -f tests/bad-pod-latest-tag.yaml 2>&1 | grep "forbidden" || exit 1
    # 5. Verify OPA Gatekeeper Root-User Policy Rejection (Forbidden UID 0)
    - kubectl apply -f tests/bad-pod-root.yaml 2>&1 | grep "forbidden" || exit 1
    # 6. Verify ServiceMonitors across namespaces (Prometheus Operator target discovery)
    - kubectl get servicemonitors -A | grep -q "sample-microservice-api-monitor" || exit 1
    # 7. Verify PrometheusRule Operational Alerting
    - kubectl get prometheusrules -n monitoring platform-operational-alerts || exit 1
    # 8. Verify HashiCorp Vault Secrets Management & Dynamic Runtime Injection
    - kubectl get pods -n vault -l app.kubernetes.io/name=vault --no-headers | grep -q "Running" || exit 1
    - kubectl exec -n production $(kubectl get pods -n production -l app=sample-microservice-api -o jsonpath='{.items[0].metadata.name}') -c sample-microservice-api -- cat /vault/secrets/database-config | grep -q "DB_USER=dbadmin" || exit 1
    # 9. Verify Promtail DaemonSet and Loki Log Aggregation
    - kubectl get daemonset -n logging promtail || exit 1
    - kubectl get pods -n logging -l app=loki --no-headers | grep -q "Running" || exit 1
    # 10. Verify Jaeger Distributed Tracing backend
    - kubectl get pods -n tracing -l app=jaeger --no-headers | grep -q "Running" || exit 1
    # 11. Verify Aqua Trivy Operator VulnerabilityReport generation
    - kubectl get vulnerabilityreports -A --no-headers | wc -l | grep -q '^[1-9]' || exit 1
    # 12. Verify Provisioned Grafana Dashboards (Cluster Health & Unified Observability)
    - kubectl get configmaps -n monitoring -l grafana_dashboard=1 | grep -q "unified-observability" || exit 1
    # 13. Verify Sample Application Workload Status
    - kubectl get pods -n production -l app=sample-microservice-api --no-headers | grep -q "Running" || exit 1
  cleanup:
    - echo "DevOps Platform validation suite completed successfully."