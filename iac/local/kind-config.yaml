# kind-config.yaml: Multi-node local Kubernetes cluster configuration
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: devops-platform
nodes:
- role: control-plane
  image: kindest/node:v1.31.0
  extraPortMappings:
  - containerPort: 30080
    hostPort: 30080
    protocol: TCP
  - containerPort: 30443
    hostPort: 30443
    protocol: TCP
  - containerPort: 30000
    hostPort: 30000
    protocol: TCP
  - containerPort: 30900
    hostPort: 30900
    protocol: TCP
  - containerPort: 31000
    hostPort: 31000
    protocol: TCP
  - containerPort: 31686
    hostPort: 31686
    protocol: TCP
  - containerPort: 30200
    hostPort: 30200
    protocol: TCP
- role: worker
  image: kindest/node:v1.31.0
  labels:
    role: "worker"
    tier: "workloads"
